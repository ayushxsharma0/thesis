; ================================
; CONFIG FILE — Testcase Generation
; ================================
; Notation (interpreted by testcase_generator.py's config parser, not by
; configparser itself -- configparser just reads these as raw strings):
;   field = [a, b, c]   -> per testcase, randomly pick ONE value from this set
;   field = a-b         -> per testcase, randomly sample a value uniformly in this range
;   field = x           -> fixed, same for every testcase in the batch

[general]
num_testcases            = 20
base_seed                = 500
max_retries_per_instance = 5
on_failure                = skip
; skip | abort
; retry also triggers if a random draw produces an unreasonably
; large h_eff (see max_total_jobs below)
max_total_jobs            = 1000
; safety cap; re-roll with a new seed if exceeded
output_folder              = batch_v3
manifest_file               = manifest.csv

[processors]
num_processors             = [1, 2, 4, 8, 16]
; random pick per testcase
freq_min                   = 0.5
freq_max                   = 1.0
freq_steps                 = [3, 5]
; random pick per testcase
energy_alpha                = 0.1-1
; random sample per testcase
; energy_budget = mandatory_energy + energy_alpha * (full_energy - mandatory_energy)

[tasks]
num_tasks                   = 4-8
; random sample per testcase
utilization_bands            = [0.2-0.4, 0.4-0.6, 0.6-0.9]
; random band pick per testcase, then random value sampled within that band

period_ratio                  = 2-9
; random sample per testcase (ratio between consecutive periods)
p_min                         = 4
; fixed base period

mk_type                        = [dense, sparse, mixed]
; random pick per testcase, independent of utilization_bands
mk_ratio_range                  = 0.3-1
; m/k sampled within a sub-range depending on mk_type
; (dense -> upper end, sparse -> lower end, mixed -> full range)
k_min                           = 2
k_max                           = 4